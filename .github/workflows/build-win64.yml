name: Build Windows x64 EXE

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-win64:
    name: Build opencode-desktop-win-x64.exe
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      OPENCODE_CHANNEL: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          os: windows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build opencode server
        run: |
          bun run --cwd packages/opencode --conditions=browser build -- --single

      - name: Build desktop (prebuild)
        run: |
          bun --cwd packages/desktop prebuild

      - name: Build desktop
        run: |
          bun --cwd packages/desktop build

      - name: Package Windows x64
        run: |
          bun --cwd packages/desktop package:win -- --x64

      - name: List build artifacts
        run: |
          ls -la packages/desktop/dist/

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-win-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.exe.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload NSIS zip
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-win-x64-installer
          path: packages/desktop/dist/*-win-x64.zip
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Create Release
    needs: build-win64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-desktop-win-x64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.exe.blockmap
            artifacts/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
